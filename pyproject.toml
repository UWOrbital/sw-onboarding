[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sw-onboarding"
version = "0.1.0"
description = "The mandatory onboarding challenge for all UW Orbital software developers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "greenlet>=3.5.4",
    "loguru>=0.7.3",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.2",
    "python-keycloak>=7.1.1",
    "ruff>=0.16.2",
    "sqlmodel>=0.0.39",
    "uvicorn>=0.52.1",
]

[tool.hatch.build.targets]
wheel.packages = ["backend"]
sdist.only-include = ["backend"]

[tool.pytest.ini_options]
addopts = "-v"
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: marks tests that depend on external services or large workloads",
]

[tool.mypy]
exclude = ["backend/tests/*", "backend/migrations/*"]
strict = true
plugins = "pydantic.mypy"
