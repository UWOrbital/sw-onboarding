services:
  postgres:
    image: postgres:16-alpine
    container_name: sw-onboarding-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${GS_DATABASE_USER}
      POSTGRES_PASSWORD: ${GS_DATABASE_PASSWORD}
      POSTGRES_DB: ${GS_DATABASE_NAME}
    ports:
      - "${GS_DATABASE_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
