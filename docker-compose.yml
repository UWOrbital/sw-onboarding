services:
  postgres:
    image: postgres:16-alpine
    container_name: sw-onboarding-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: onboarding
      POSTGRES_PASSWORD: onboarding
      POSTGRES_DB: sw_onboarding
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onboarding -d sw_onboarding"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
