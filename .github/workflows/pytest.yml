name: Pytest

on:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12"]

    # Same image, credentials, and host port as docker-compose.yml, so the env below is unchanged.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: onboarding
          POSTGRES_PASSWORD: onboarding
          POSTGRES_DB: sw_onboarding
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U onboarding -d sw_onboarding"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync

      - name: Run pytest
        env:
          CORS_ALLOW_ORIGINS: "[\"http://localhost:5175\",\"http://127.0.0.1:5175\"]"
          CORS_ALLOW_CREDENTIALS: true
          CORS_ALLOW_METHOD: "[\"*\"]"
          CORS_ALLOW_HEADERS: "[\"*\"]"

          GS_DATABASE_USER: onboarding
          GS_DATABASE_PASSWORD: onboarding
          GS_DATABASE_LOCATION: localhost
          GS_DATABASE_PORT: 5433
          GS_DATABASE_NAME: sw_onboarding
        run: |
          uv run pytest
